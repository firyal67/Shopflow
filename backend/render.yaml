services:
  - type: web
    name: shopflow-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: shopflow-db
          property: connectionString
      - key: DATABASE_HOST
        fromDatabase:
          name: shopflow-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: shopflow-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: shopflow-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: shopflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: shopflow-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://shopflow-feryel.vercel.app,https://shopflow-git-main-feryel.vercel.app,https://shopflow-phi-livid.vercel.app,https://*.vercel.app
      - key: PORT
        value: 9090

databases:
  - name: shopflow-db
    databaseName: shopflowdb
    user: shopflow
    plan: free
